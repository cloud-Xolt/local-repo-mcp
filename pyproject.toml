[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-repo-mcp"
dynamic = ["version"]
description = "A security-oriented MCP server for one configured Git repository"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "mcp==2.0.0",
  "customtkinter==5.2.2",
  "uvicorn==0.52.0",
  "starlette==0.52.1",
  "httpx==0.28.1",
  "PyYAML==6.0.3",
  "pytest==8.4.2",
  "typing-extensions==4.16.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
local-repo-mcp = "mcp_app.launcher:main"
local-repo-mcp-gui = "gui.desktop:main"
local-repo-mcp-cli = "gui.cli:main"

[tool.setuptools]
packages = [
  "audit",
  "commands",
  "gui",
  "mcp_app",
  "repo",
  "security",
  "tools",
]

[tool.setuptools.package-dir]
audit = "src/audit"
commands = "src/commands"
gui = "gui"
mcp_app = "src/mcp_app"
repo = "src/repo"
security = "src/security"
tools = "src/tools"

[tool.setuptools.package-data]
gui = ["assets/*"]

[tool.setuptools.dynamic]
version = {attr = "mcp_app.version.VERSION"}
