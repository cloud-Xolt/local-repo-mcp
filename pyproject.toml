[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-repo-mcp"
dynamic = ["version"]
description = "A security-oriented MCP server for one configured Git repository"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "mcp>=2.0.0,<3.0.0",
  "customtkinter>=5.2.2,<6.0.0",
  "uvicorn>=0.30.0,<1.0.0",
  "starlette>=0.40.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "PyYAML>=6.0.2,<7.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0,<9.0.0"]

[project.scripts]
local-repo-mcp = "mcp_app.launcher:main"
local-repo-mcp-gui = "gui.desktop:main"

[tool.setuptools]
packages = [
  "audit",
  "gui",
  "mcp_app",
  "repo",
  "security",
  "tools",
]

[tool.setuptools.package-dir]
audit = "src/audit"
gui = "gui"
mcp_app = "src/mcp_app"
repo = "src/repo"
security = "src/security"
tools = "src/tools"

[tool.setuptools.package-data]
gui = ["assets/*"]

[tool.setuptools.dynamic]
version = {attr = "mcp_app.version.VERSION"}
